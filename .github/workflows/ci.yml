name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bytecode compilation check
        run: |
          python -m compileall patch_engine tests

      - name: Run unit test suite
        run: |
          python -m unittest discover -s tests -v

      - name: Test CLI execution
        run: |
          python -m patch_engine scan tests/fixtures
          python -m patch_engine patch tests/fixtures --dry-run
